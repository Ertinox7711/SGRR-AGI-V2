# gitleaks config — SGRR AGI V2
# Extends the default ruleset with domain-specific patterns.
# Docs: https://github.com/gitleaks/gitleaks

title = "SGRR AGI V2 secret scan"

[extend]
useDefault = true   # keep the ~150 built-in rules (AWS, GitHub, Stripe, etc.)

# --- Custom rules ------------------------------------------------------------

[[rules]]
id = "shopify-access-token"
description = "Shopify access/secret token"
regex = '''shp(at|ca|pa|ss)_[a-fA-F0-9]{32}'''
tags = ["shopify", "token"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[a-zA-Z0-9_\-]{20,}'''
tags = ["anthropic", "key"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API key"
regex = '''sk-[a-zA-Z0-9]{20,}T3BlbkFJ[a-zA-Z0-9]{20,}'''
tags = ["openai", "key"]

[[rules]]
id = "generic-bearer-secret"
description = "Generic high-entropy secret assignment"
regex = '''(?i)(api[_-]?key|secret|token|passwd|password)\s*[:=]\s*['"][a-zA-Z0-9_\-]{24,}['"]'''
tags = ["generic"]

# NOTE — absolute home paths are deliberately NOT a gitleaks rule.
# There used to be one here. It fired on 55 lines that are all legitimate: the published
# placeholder (C:/Users/YOU), GitHub Actions' own /home/runner, and the path-validation
# fixtures of the vendored third-party skills. Keeping it green needed a placeholder
# allowlist maintained in a FOURTH place, drifting against the three that already exist.
# So the split is by job, not by tool: gitleaks owns SECRETS (and scans the whole
# history for them); `scripts/preflight-scrub.sh` owns PII paths and addresses, runs in
# the same workflow, and is the one place where .scrubignore decides what is reviewed
# third-party code. One scanner, one allowlist, three call sites (hook, manual, CI).

# --- Allowlist: what is NOT a leak ------------------------------------------

[allowlist]
description = "Placeholders, examples, and reviewed test fixtures that are allowed"
regexes = [
  '''<[A-Z_]+>''',                         # <PLACEHOLDER>, <YOUR_NAME>...
  '''users\.noreply\.github\.com''',       # GitHub noreply email
  '''example\.(com|org)''',
  '''<REDACTED_TOKEN>''',
  # Secret-sink fixture of a vendored third-party skill: a deliberately fake AWS key
  # (sequential letters) asserted on by skills/gstack/test/brain-sync.test.ts. Listed as
  # the literal value rather than allowlisting the whole tree, so a REAL key vendored in
  # that same directory would still be caught.
  '''AKIAABCDEFGHIJKLMNOP''',
]
paths = [
  '''\.gitleaks\.toml$''',                          # this file holds the patterns themselves
  '''(^|/)SECUR(ITE|ITY)\.md$''',                   # security doc cites token shapes + sample paths (FR+EN names live in history)
  '''(^|/)assets/''',                               # decorative SVGs
  '''(^|/)scripts/preflight-scrub\.(ps1|sh)$''',    # scanner script — carries the detection patterns by design
  '''(^|/)scripts/hooks/pre-commit$''',             # pre-commit scanner — same
  '''(^|/)\.github/workflows/secret-scan\.yml$''',  # CI scanner workflow — same
]
